spring.application.name=restaurant
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/restaurant_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:restaurant_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:restaurant_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
